spark.history.fs.logDirectory=file:///opt/spark/events
spark.history.ui.port=18080
spark.eventLog.enabled=true
spark.eventLog.dir=file:///opt/spark/events

# Partition and parallelism tuning for better distribution
spark.sql.shuffle.partitions=64
spark.default.parallelism=32

# Memory settings  
spark.driver.memory=3g
spark.executor.memory=1536m
spark.executor.memoryOverhead=256m

# Partition size tuning - 128 MB for each node partition
spark.sql.maxSinglePartitionBytes=134217728
spark.sql.files.maxPartitionBytes=134217728

# Performance tuning for distributed processing
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.skewJoin.enabled=true

# Compression for network efficiency
spark.shuffle.compress=true
spark.shuffle.spill.compress=true

# Python path for executor workers — needed so the processor/ package
# (in the volume-mounted scripts/ dir) is importable on all Spark workers.
spark.executorEnv.PYTHONPATH=/opt/spark/scripts
